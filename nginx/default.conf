server {
  listen 80;
  listen [::]:80;
  server_name localhost;

  root /usr/share/nginx/html;
  index index.html;

  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  types { application/manifest+json webmanifest; }

  # "/" też jest HTML (index.html) -> krótki cache
  location = / {
    add_header Cache-Control "public, max-age=300";
    expires off;
    try_files /index.html =404;
  }

  # HTML z rozszerzeniem .html -> krótki cache
  location ~* \.(html)$ {
    add_header Cache-Control "public, max-age=300";
    expires off;
    try_files $uri =404;
  }

  # Assets (Tailwind build, lokalne JS): długi cache + immutable
  location /assets/ {
    add_header Cache-Control "public, max-age=2592000, immutable";
    expires off;
    try_files $uri =404;
  }

  location / {
    try_files $uri $uri/ =404;
  }

  location = /favicon/site.webmanifest {
    default_type application/manifest+json;
    try_files /favicon/site.webmanifest =404;
  }

  # Pozostałe statyczne: długi cache + immutable
  location ~* \.(css|js|map|ico|png|svg|webmanifest)$ {
    add_header Cache-Control "public, max-age=2592000, immutable";
    expires off;
    try_files $uri =404;
  }
}
