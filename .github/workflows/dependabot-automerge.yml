name: Dependabot auto-merge

# Auto-merge dependabot PRs once CI is green.
# Patch and minor bumps merge automatically. Major bumps stay open with
# a `needs-review` label so a human can eyeball breaking changes.

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  pull-requests: write
  contents: write

jobs:
  automerge:
    name: Auto-merge dependabot PR
    # pull_request_target has write credentials: accept only Dependabot PRs
    # whose head repository is this repository, never a fork.
    if: >-
      github.event.pull_request.user.login == 'dependabot[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Get update metadata
        id: meta
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Label major upgrades for review (skip auto-merge)
        if: steps.meta.outputs.update-type == 'version-update:semver-major'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              labels: ['needs-review', 'major-upgrade'],
            });
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              body: '🚧 Major version bump — held back from auto-merge. Please review the changelog before merging.',
            });

      - name: Enable auto-merge for patch & minor
        if: steps.meta.outputs.update-type != 'version-update:semver-major'
        run: gh pr merge --squash --auto "$PR_NUMBER"
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
