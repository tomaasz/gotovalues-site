name: SonarQube

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: sonarqube-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  sonarqube:
    # Self-hosted runners must never execute untrusted fork code.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: self-hosted
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: latest

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Run tests
        continue-on-error: true
        run: pnpm test

      - name: Semgrep SARIF
        continue-on-error: true
        run: |
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -e HOME=/tmp \
            -v "$PWD:/src" -w /src \
            semgrep/semgrep semgrep scan \
              --config=p/security-audit \
              --config=p/secrets \
              --config=p/owasp-top-ten \
              --sarif --output=semgrep.sarif

      - name: Gitleaks SARIF
        continue-on-error: true
        run: |
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -v "$PWD:/repo" -w /repo \
            ghcr.io/gitleaks/gitleaks:latest \
            detect --source=. --redact --no-banner \
            --report-format sarif --report-path gitleaks.sarif

      - name: Trivy SARIF
        continue-on-error: true
        run: |
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -e HOME=/tmp -e TRIVY_CACHE_DIR=/tmp/.trivy \
            -v "$PWD:/src" -w /src \
            aquasec/trivy:latest \
            fs --scanners vuln \
               --skip-dirs ".next,node_modules,.vercel,out,dist,public,_bak_archive" \
               --format sarif --output trivy.sarif .

      - name: Generate CycloneDX SBOM (Trivy)
        continue-on-error: true
        run: |
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -e HOME=/tmp -e TRIVY_CACHE_DIR=/tmp/.trivy \
            -v "$PWD:/src" -w /src \
            aquasec/trivy:latest \
            fs --skip-dirs ".next,node_modules,.vercel,out,dist,public,_bak_archive" \
               --format cyclonedx --output sbom.cdx.json .

      - name: Upload SBOM to Dependency-Track
        if: ${{ secrets.DEPTRACK_URL != '' && secrets.DEPTRACK_API_KEY != '' }}
        continue-on-error: true
        env:
          DEPTRACK_URL: ${{ secrets.DEPTRACK_URL }}
          DEPTRACK_API_KEY: ${{ secrets.DEPTRACK_API_KEY }}
          PROJECT_NAME: ${{ github.event.repository.name }}
          PROJECT_VERSION: ${{ github.sha }}
        run: |
          curl -sS -X POST "$DEPTRACK_URL/api/v1/bom" \
            -H "X-Api-Key: $DEPTRACK_API_KEY" \
            -F "autoCreate=true" \
            -F "projectName=$PROJECT_NAME" \
            -F "projectVersion=$PROJECT_VERSION" \
            -F "bom=@sbom.cdx.json" | head -c 300 ; echo

      - name: SonarQube Scan
        continue-on-error: true
        uses: SonarSource/sonarqube-scan-action@22918119ff8e1ca75a623e15c8296b6ea4fbe28f # v8
        with:
          args: >
            -Dsonar.sarifReportPaths=semgrep.sarif,gitleaks.sarif,trivy.sarif
            -Dsonar.qualitygate.wait=true
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
