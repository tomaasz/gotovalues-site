sonar.projectKey=gotovalues-site
sonar.projectName=gotovalues-site
sonar.projectVersion=2.0

sonar.sourceEncoding=UTF-8

sonar.sources=src,instrumentation.ts,next.config.ts
sonar.tests=tests
sonar.test.inclusions=tests/**/*.test.ts,tests/**/*.test.tsx

# Marketing site — skip generated, vendored, lock, and config noise.
sonar.exclusions=**/.next/**,**/node_modules/**,**/.vercel/**,**/out/**,**/dist/**,**/public/**,**/*.min.js,**/*.snap,**/*.generated.*,**/*.d.ts,_bak_archive/**,scripts/**

sonar.cpd.exclusions=tests/**,src/content/**

sonar.typescript.tsconfigPaths=tsconfig.json
sonar.javascript.node.maxspace=4096

sonar.qualitygate.wait=true
sonar.qualitygate.timeout=300
